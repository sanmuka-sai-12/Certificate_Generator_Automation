<script>
/**
 * Client-side PDF generation using pdf-lib and qrcode-generator
 */

async function makePdfFromImage(jpgDataUrl, title) {
  if (typeof PDFLib === 'undefined') {
    throw new Error('pdf-lib is not loaded');
  }
  const doc = await PDFLib.PDFDocument.create();
  const bytes = Uint8Array.from(atob(jpgDataUrl.split(',')[1]), c => c.charCodeAt(0));
  const img = await doc.embedJpg(bytes);
  // A4 landscape in points: 841.89 x 595.28
  const page = doc.addPage([841.89, 595.28]);
  page.drawImage(img, { x: 0, y: 0, width: 841.89, height: 595.28 });
  doc.setTitle(title || 'Certificate');
  doc.setCreator('Smart Certificate Generator');
  return await doc.saveAsBase64();
}

function makeQrDataUrl(text) {
  if (typeof qrcode === 'undefined') {
    throw new Error('qrcode-generator is not loaded');
  }
  const qr = qrcode(0, 'M');
  qr.addData(text);
  qr.make();
  return qr.createDataURL(10, 0);
}

</script>
