<script>
/**
 * Application Router and Shell Manager
 */
const routes = {};
let currentUser = { email: '', quota: 0, kind: '' };

function route(path, handler) {
  routes[path] = handler;
}

function navigate(hash) {
  location.hash = hash.startsWith('#') ? hash : '#' + hash;
}

function handleRoute() {
  const hash = location.hash || '#/dashboard';
  const parts = hash.slice(2).split('/');
  const rootRoute = parts[0] || 'dashboard';
  const params = parts.slice(1);

  // Update active state in nav
  document.querySelectorAll('.nav-item').forEach(el => {
    const target = el.getAttribute('data-route');
    if (target === rootRoute) el.classList.add('active');
    else el.classList.remove('active');
  });

  const handler = routes[rootRoute] || routes['dashboard'];
  if (typeof handler === 'function') {
    handler(params);
  }
}

window.addEventListener('hashchange', handleRoute);

async function initApp() {
  renderSidebar();
  try {
    const [u, sender] = await Promise.all([
      api.whoAmI(),
      api.senderInfo().catch(() => ({ email: '', quota: 0, kind: '' }))
    ]);
    currentUser = {
      email: (u && u.email) || sender.email || 'Authenticated User',
      quota: sender.quota || 0,
      kind: sender.kind || 'Personal'
    };
    updateUserInNav();
  } catch (e) {
    console.error('Failed to load user info:', e);
  }
  handleRoute();
}

function renderSidebar() {
  const nav = document.getElementById('nav');
  if (!nav) return;

  nav.innerHTML = `
    <div class="brand">
      <svg fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L1 21h22L12 2zm0 3.99L19.53 19H4.47L12 5.99zM11 10h2v4h-2zm0 6h2v2h-2z"/></svg>
      <span>CertGen</span>
    </div>
    <ul class="nav-menu">
      <li class="nav-item" data-route="dashboard">
        <a href="#/dashboard">Dashboard</a>
      </li>
      <li class="nav-item" data-route="projects">
        <a href="#/projects">Projects</a>
      </li>
      <li class="nav-item" data-route="templates">
        <a href="#/templates">Templates</a>
      </li>
      <li class="nav-item" data-route="settings">
        <a href="#/settings">Settings</a>
      </li>
    </ul>
    <div class="nav-user">
      <div class="user-email" id="userEmailDisplay">Loading account...</div>
      <div class="user-quota" id="userQuotaDisplay">Checking quota...</div>
    </div>
  `;
}

function updateUserInNav() {
  const emailEl = document.getElementById('userEmailDisplay');
  const quotaEl = document.getElementById('userQuotaDisplay');
  if (emailEl) emailEl.textContent = currentUser.email || 'Google Account';
  if (quotaEl) quotaEl.textContent = `Daily Quota: ${currentUser.quota} left`;
}

document.addEventListener('DOMContentLoaded', initApp);

</script>
