<script>
  /**
   * API wrapper around google.script.run with Promise support
   */
  const api = new Proxy({}, {
    get: (_, fn) => (...args) => new Promise((resolve, reject) => {
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(res => resolve(res))
          .withFailureHandler(err => {
            const msg = (err && err.message) ? err.message : String(err || 'Server error occurred');
            toast(msg, true);
            reject(err);
          })
          [fn](...args);
      } else {
        console.warn(`[Local Dev Mock] Called api.${fn} with args:`, args);
        // Minimal mock responses for offline/local development preview
        if (fn === 'whoAmI') resolve({ email: 'developer@example.com' });
        else if (fn === 'listProjects') resolve([]);
        else if (fn === 'senderInfo') resolve({ email: 'developer@example.com', quota: 100, kind: 'Personal Gmail' });
        else resolve({ ok: true });
      }
    })
  });

  /**
   * Global toast notification system
   * @param {string} msg 
   * @param {boolean} [isErr=false] 
   */
  function toast(msg, isErr = false) {
    const t = document.getElementById('toast');
    if (!t) return;
    t.textContent = msg;
    t.className = isErr ? 'err show' : 'show';
    clearTimeout(t._timer);
    t._timer = setTimeout(() => {
      t.className = '';
    }, 4000);
  }
</script>
